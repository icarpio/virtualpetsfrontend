<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Virtual Pets</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .spinner-border {
            width: 3rem;
            height: 3rem;
        }
        input[type="text"], input[type="password"], input[type="email"] {
            display: block;
            width: 100%;
            padding: 0.375rem 0.75rem;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.5;
            color: #212529;
            background-color: #fff;
            background-clip: padding-box;
            border: 1px solid #ced4da;
            border-radius: 0.375rem;
            transition: border-color .15s ease-in-out,box-shadow .15s ease-in-out;
        }
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .alert {
            border-radius: 0.375rem;
        }
    </style>
</head>
<body class="bg-light">
    <!-- Loader a pantalla completa -->
    <div id="loader">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div class="container">
        <div class="row justify-content-center min-vh-100 align-items-center">
            <div class="col-12 col-md-6 col-lg-4">
                
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <div class="text-center">
                            <img src="images/logo.png" alt="logo" style="width: 100%;">
                        </div>
                        <br>
                        <div class="text-center">
                            <h4 style="color: #6441A5;">Sign in</h4>
                        </div>

                        <!-- Alerta de errores -->
                        <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mb-3" style="background-color: #ffcc03; color: white; border: none;">
                                Sign in
                            </button>
                        </form>

                        <div class="text-center">
                            <p class="mb-0">Don't have an account? <a href="register.html" class="text-decoration-none">Sign up here</a></p>
                        </div>

                        <footer class="mt-4">
                            <p class="text-muted text-center small">By logging in, you accept our Terms and Privacy Policy.</p>
                        </footer>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script>
        
    const API_URL = CONFIG.API_URL;

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Mostrar loader
            document.getElementById('loader').style.display = 'flex';
            document.getElementById('errorAlert').classList.add('d-none');

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_URL}/accounts/api/auth/login/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        source: 'virtualpets'
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Guardar token y datos del usuario
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    // Redirigir al dashboard
                    window.location.href = 'pet_dashboard.html';
                } else {
                    // Mostrar error
                    const errorAlert = document.getElementById('errorAlert');
                    errorAlert.textContent = data.error || 'Error al iniciar sesión';
                    errorAlert.classList.remove('d-none');
                }
            } catch (error) {
                console.error('Error:', error);
                const errorAlert = document.getElementById('errorAlert');
                errorAlert.textContent = 'Error de conexión con el servidor';
                errorAlert.classList.remove('d-none');
            } finally {
                // Ocultar loader
                document.getElementById('loader').style.display = 'none';
            }
        });
    </script>
</body>
</html>
