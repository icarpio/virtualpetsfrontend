<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - Virtual Pets</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .spinner-border {
            width: 3rem;
            height: 3rem;
        }
        input[type="text"], input[type="password"], input[type="email"] {
            display: block;
            width: 100%;
            padding: 0.375rem 0.75rem;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.5;
            color: #212529;
            background-color: #fff;
            background-clip: padding-box;
            border: 1px solid #ced4da;
            border-radius: 0.375rem;
            transition: border-color .15s ease-in-out,box-shadow .15s ease-in-out;
        }
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .alert {
            border-radius: 0.375rem;
        }
        .error-text {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body class="bg-light">
    <!-- Loader a pantalla completa -->
    <div id="loader">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div class="container">
        <div class="row justify-content-center min-vh-100 align-items-center">
            <div class="col-12 col-md-6 col-lg-5">
                
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <div class="text-center">
                            <img src="images/logo.png" alt="logo" style="width: 100%;">
                        </div>
                        <br>
                        <div class="text-center">
                            <h4 style="color: #6441A5;">Sign up</h4>
                        </div>

                        <!-- Alerta de éxito -->
                        <div id="successAlert" class="alert alert-success d-none" role="alert"></div>
                        
                        <!-- Alerta de errores -->
                        <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                                <div id="usernameError" class="error-text"></div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                                <div id="emailError" class="error-text"></div>
                            </div>
                            <!--  
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="first_name" class="form-label">First Name</label>
                                    <input type="text" class="form-control" id="first_name" name="first_name">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="last_name" class="form-label">Last Name</label>
                                    <input type="text" class="form-control" id="last_name" name="last_name">
                                </div>
                            </div> -->

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                                <div id="passwordError" class="error-text"></div>
                                <small class="text-muted">Minimum 8 characters</small>
                            </div>

                            <div class="mb-3">
                                <label for="password2" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="password2" name="password2" required>
                                <div id="password2Error" class="error-text"></div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mb-3" style="background-color: #ffcc03; color: white; border: none;">
                                Sign up
                            </button>
                        </form>

                        <div class="text-center">
                            <p class="mb-0">Already have an account? <a href="index.html" class="text-decoration-none">Sign in here</a></p>
                        </div>

                        <footer class="mt-4">
                            <p class="text-muted text-center small">By signing up, you accept our Terms and Privacy Policy.</p>
                        </footer>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script>
        
        const API_URL = CONFIG.API_URL; // Cambia esto por tu URL de backend

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Limpiar errores previos
            document.querySelectorAll('.error-text').forEach(el => el.textContent = '');
            document.getElementById('errorAlert').classList.add('d-none');
            document.getElementById('successAlert').classList.add('d-none');
            
            // Mostrar loader
            document.getElementById('loader').style.display = 'flex';

            const formData = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                //first_name: document.getElementById('first_name').value,
                //last_name: document.getElementById('last_name').value,
                password: document.getElementById('password').value,
                password2: document.getElementById('password2').value,
                source: 'virtualpets' 
            };

            try {
                const response = await fetch(`${API_URL}/accounts/api/auth/register/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    // Mostrar mensaje de éxito
                    const successAlert = document.getElementById('successAlert');
                    successAlert.textContent = data.message || 'Registration successful!';
                    successAlert.classList.remove('d-none');
                    
                    // Guardar token y datos del usuario
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    // Limpiar formulario
                    document.getElementById('registerForm').reset();
                    
                    // Redirigir después de 2 segundos
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    // Mostrar errores específicos de cada campo
                    if (data.username) {
                        document.getElementById('usernameError').textContent = data.username[0];
                    }
                    if (data.email) {
                        document.getElementById('emailError').textContent = data.email[0];
                    }
                    if (data.password) {
                        document.getElementById('passwordError').textContent = data.password[0];
                    }
                    if (data.password2) {
                        document.getElementById('password2Error').textContent = data.password2[0];
                    }
                    
                    // Mostrar error general si existe
                    if (data.error || data.non_field_errors) {
                        const errorAlert = document.getElementById('errorAlert');
                        errorAlert.textContent = data.error || data.non_field_errors[0];
                        errorAlert.classList.remove('d-none');
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                const errorAlert = document.getElementById('errorAlert');
                errorAlert.textContent = 'Connection error with server';
                errorAlert.classList.remove('d-none');
            } finally {
                // Ocultar loader
                document.getElementById('loader').style.display = 'none';
            }
        });
    </script>
</body>
</html>
